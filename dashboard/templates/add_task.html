{% extends 'base.html' %}

{% block content %}

<div class="form-box">

<h1>Add Task</h1>

<form method="POST">

{% csrf_token %}

<label>Task</label>

<input
    type="text"
    name="title"
    placeholder="Solve 3 DP problems"
    required
>

<button type="submit">Add Task</button>

</form>

</div>

{% endblock %}
